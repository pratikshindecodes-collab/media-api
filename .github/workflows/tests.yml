
name: Backend Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Start MongoDB replica set
        run: |
          docker run -d \
            --name mongo-rs \
            -p 27017:27017 \
            mongo:8 \
            mongod --replSet rs0 --bind_ip_all

          for i in {1..30}; do
            if docker exec mongo-rs mongosh --quiet \
              --eval 'db.adminCommand({ ping: 1 }).ok' | grep -q 1; then
              break
            fi
            sleep 2
          done

          docker exec mongo-rs mongosh --quiet --eval '
            rs.initiate({
              _id: "rs0",
              members: [{ _id: 0, host: "127.0.0.1:27017" }]
            })
          '

          for i in {1..30}; do
            if docker exec mongo-rs mongosh --quiet \
              --eval 'db.hello().isWritablePrimary' | grep -q true; then
              echo "MongoDB replica set is ready"
              exit 0
            fi
            sleep 2
          done

          echo "MongoDB replica set failed to become ready"
          docker logs mongo-rs
          exit 1

      - name: Install dependencies
        run: npm ci
      
      
      - name: Run tests
        env:
          REDIS_URL: redis://127.0.0.1:6379
          MONGO_URI: mongodb://127.0.0.1:27017/media_api_test?replicaSet=rs0
          JWT_SECRET: ci-test-secret-not-for-production
          NODE_ENV: test
        run: npm test -- --run

